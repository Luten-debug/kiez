<style>
  :root {
    --bg: #ffffff; --fg: #111113; --muted: #8a8a90; --line: #e6e6ea;
    --tile: #f1f1f4; --tile-bez: #d9dbe2; --accent: #e31937; --dot: #111113; --lbl: #5d5d64; --halo: rgba(255,255,255,.85);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --fg: #f4f4f6; --muted: #8b8b93; --line: #232327;
      --tile: #1a1a1d; --tile-bez: #34353b; --accent: #ff3b55; --dot: #ffffff; --lbl: #a3a3ab; --halo: rgba(11,11,12,.8); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    padding: calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; min-height: 100%;
    -webkit-user-select: none; user-select: none; overflow-x: hidden;
  }

  /* ---------- Einstieg: alles gleitet gestaffelt herein ---------- */
  .enter { opacity: 0; transform: translateY(14px); filter: blur(6px);
    animation: enter .9s var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes enter { to { opacity: 1; transform: none; filter: none; } }

  .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #ortsteil { font-size: clamp(40px, 13vw, 64px); font-weight: 700; letter-spacing: -.03em; line-height: 1.04;
    margin-top: 10px; min-height: 1.04em; word-break: break-word; hyphens: auto; }

  /* ---------- Name: Buchstaben tauchen einzeln aus der Unschärfe auf ---------- */
  .ch { display: inline-block; white-space: pre; opacity: 0; transform: translateY(.35em) rotate(4deg); filter: blur(8px);
    animation: ch .7s var(--ease-out) forwards; animation-delay: calc(var(--d) * 28ms); }
  @keyframes ch { to { opacity: 1; transform: none; filter: none; } }
  .out .ch { animation: chOut .28s ease-in forwards; animation-delay: calc(var(--d) * 12ms); opacity: 1; transform: none; filter: none; }
  @keyframes chOut { to { opacity: 0; transform: translateY(-.3em); filter: blur(6px); } }

  /* Suchen: Shimmer über den Platzhalter */
  .searching { background: linear-gradient(90deg, var(--muted) 0%, var(--fg) 45%, var(--muted) 90%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  #bezirk, #hint { transition: opacity .5s var(--ease-out), transform .5s var(--ease-out); }
  #bezirk { font-size: 20px; font-weight: 500; margin-top: 10px; min-height: 1.3em; }
  #hint { font-size: 15px; color: var(--muted); margin-top: 12px; min-height: 21px; line-height: 1.4; }
  .swap { opacity: 0 !important; transform: translateY(6px) !important; }

  /* Grenz-Hinweis als kleiner Chip */
  #hint:not(:empty)::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- Karte ---------- */
  .map { flex: 1; position: relative; min-height: 280px; margin: 18px 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 22px; cursor: pointer; }
  svg path { stroke: var(--bg); stroke-width: .7; vector-effect: non-scaling-stroke; fill: var(--tile);
    transition: fill .6s var(--ease-out); }
  svg path.bez { fill: var(--tile-bez); }
  svg path.cur { fill: var(--accent); }
  svg .tile-in { opacity: 0; animation: tile .7s var(--ease-out) forwards; animation-delay: calc(var(--d) * 6ms); }
  @keyframes tile { from { opacity: 0; } to { opacity: 1; } }
  #acc { fill: var(--accent); fill-opacity: .14; transition: r .8s var(--ease-out); }
  #dot { fill: var(--dot); stroke: var(--bg); vector-effect: non-scaling-stroke; stroke-width: 2.5; }
  #ring { fill: none; stroke: var(--dot); vector-effect: non-scaling-stroke; stroke-width: 1.5;
    transform-box: fill-box; transform-origin: center; animation: ring 2.2s var(--ease-out) infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .6; } to { transform: scale(3.4); opacity: 0; } }
  /* Ortsteil-Beschriftungen */
  #labels text { fill: var(--lbl); font-weight: 600; text-anchor: middle; dominant-baseline: central;
    paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; letter-spacing: -.01em;
    opacity: 0; transition: opacity .45s var(--ease-out); pointer-events: none; }
  #labels text.on { opacity: 1; }
  #labels text.cur { fill: #fff; stroke: var(--accent); font-weight: 700; }
  #labels text.bez { fill: var(--fg); }
  #labels text.cur-out { fill: var(--accent); font-weight: 700; transform: translateY(-1.2em); }
  .zoom-tag { position: absolute; right: 12px; bottom: 10px; font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .04em; transition: opacity .4s; }

  /* ---------- Fußzeile & Button ---------- */
  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
  #meta { font-size: 13px; color: var(--muted); line-height: 1.45; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--fg);
    border: 0; border-radius: 999px; padding: 12px 18px 12px 16px; cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .45s var(--spring), opacity .2s;
  }
  button:active { transform: scale(.92); transition-duration: .12s; }
  button svg { width: 17px; height: 17px; max-height: none; overflow: visible; }
  button svg path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vector-effect: none; transition: none; }
  button.busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

  let curFits = false;
  for (const f of order) {
    const lw = Math.max(...f.lines.map(l => l.length)) * LABEL_PX * 0.56 * u;
    const lh = f.lines.length * LABEL_PX * 1.15 * u;
    const box = [f.lx - lw / 2 - 3 * u, f.ly - lh / 2 - 2 * u, f.lx + lw / 2 + 3 * u, f.ly + lh / 2 + 2 * u];
    if (box[0] < fx || box[2] > fx + fw || box[1] < fy || box[3] > fy + fh) continue;      // außerhalb
    const pw = projX(f.bb[2]) - projX(f.bb[0]);
    if (f !== current && pw < lw * 0.7) continue;                                              // Fläche zu klein
    if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue; // Überlappung
    placed.push(box);
    if (f === current) curFits = pw >= lw * 0.95;
    f.lbl.classList.add('on');
  }
  for (const f of DATA) {
    f.lbl.classList.toggle('cur', f === current && curFits);
    f.lbl.classList.toggle('cur-out', f === current && !curFits);
    f.lbl.classList.toggle('bez', !!current && f !== current && f.b === current.b);
  }
}
function flyTo(target, ms = 1100) {
  cancelAnimationFrame(vbAnim);
  for (const f of DATA) f.lbl.classList.remove('on');
  if (REDUCED) { vb = target.slice(); svg.setAttribute('viewBox', vb.join(' ')); sizeMarkers(); placeLabels(); return; }
  const from = vb.slice(), t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = ease(t);
    vb = from.map((v, i) => v + (target[i] - v) * e);
    svg.setAttribute('viewBox', vb.join(' '));
    sizeMarkers();
    if (t < 1) vbAnim = requestAnimationFrame(step); else placeLabels();
  };
  vbAnim = requestAnimationFrame(step);
}
function bezirkBox(name) {
  let a = [Infinity, Infinity, -Infinity, -Infinity];
  for (const f of DATA) if (f.b === name) {
    a[0] = Math.min(a[0], f.bb[0]); a[1] = Math.min(a[1], f.bb[1]); a[2] = Math.max(a[2], f.bb[2]); a[3] = Math.max(a[3], f.bb[3]);
  }
  const x = projX(a[0]), y = projY(a[3]), w = projX(a[2]) - x, h = projY(a[1]) - y, pad = 1.2;
  return fit(x - w * (pad - 1) / 2, y - h * (pad - 1) / 2, w * pad, h * pad);
}
let zoomed = false, current = null;
function applyZoom() {
  const tag = document.getElementById('zoomTag');
  if (zoomed && current) { flyTo(bezirkBox(current.b)); tag.textContent = 'GANZ BERLIN ↗'; }
  else { flyTo(FULL); tag.textContent = current ? 'BEZIRK ↘' : ''; }
}
addEventListener('resize', () => { FULL = fit(-6, -6, W + 12, H + 12); cancelAnimationFrame(vbAnim); vb = (zoomed && current) ? bezirkBox(current.b) : FULL.slice(); svg.setAttribute('viewBox', vb.join(' ')); sizeMarkers(); placeLabels(); });
svg.addEventListener('click', () => { if (!current) return; zoomed = !zoomed; applyZoom(); });

// ---------- Text-Animationen ----------
const $ = id => document.getElementById(id);
function setName(text) {
  const el = $('ortsteil');
  const target = el._target !== undefined ? el._target : el.dataset.text;
  if (target === text) return;
  el._target = text;
  clearTimeout(el._timer);
  const write = () => {
    el.classList.remove('out', 'searching');
    el.dataset.text = text;
    el.setAttribute('aria-label', text);
    el.innerHTML = '';
    [...text].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.style.setProperty('--d', i); s.textContent = c; s.setAttribute('aria-hidden', 'true');
      el.appendChild(s);
    });
  };
  if (el.dataset.text && !REDUCED) { el.classList.add('out'); el._timer = setTimeout(write, 260); } else write();
}
function swapText(id, text) {
  const el = $(id);
  const target = el._target !== undefined ? el._target : el.textContent;
  if (target === text) return;
  el._target = text;
  clearTimeout(el._timer);
  if (REDUCED) { el.textContent = text; return; }
  el.classList.add('swap');
  el._timer = setTimeout(() => { el.textContent = text; el.classList.remove('swap'); }, 220);
}
let shownAcc = 0;
function countAcc(to) {
  const from = shownAcc, t0 = performance.now(), el = $('accNum');
  if (!el) return;
  const step = now => {
    const t = Math.min(1, (now - t0) / 600), v = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));
    el.textContent = v; if (t < 1) requestAnimationFrame(step); else shownAcc = to;
  };
  requestAnimationFrame(step);
}
function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10 || 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',')} km`; }

// ---------- Standort ----------
let firstFix = true, hasFix = false;
function render(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords;
  const { hit, near } = locate(lat, lon);
  hasFix = true;
  $('refresh').classList.remove('busy');

  for (const f of DATA) {
    f.el.classList.toggle('cur', f === hit);
    f.el.classList.toggle('bez', !!hit && f !== hit && f.b === hit.b);
  }
  if (hit) {
    $('lbl').textContent = 'Du bist in';
    setName(hit.o);
    swapText('bezirk', hit.o === hit.b ? `Bezirk ${hit.b}` : hit.b);
    const border = near.find(n => n.d < Math.max(60, accuracy));
    swapText('hint', border ? `Grenze zu ${border.f.o} in ca. ${fmtDist(border.d)}` : '');
  } else {
    $('lbl').textContent = 'Du bist';
    setName('Außerhalb Berlins');
    const n = near[0];
    swapText('bezirk', n ? `${fmtDist(n.d)} bis ${n.f.o}` : '');
    swapText('hint', '');
  }

  const inView = lon >= minX - .05 && lon <= maxX + .05 && lat >= minY - .05 && lat <= maxY + .05;
  const x = projX(lon), y = projY(lat);
  for (const c of [dot, ring, acc]) { c.setAttribute('cx', x); c.setAttribute('cy', y); }
  dotOn = inView; sizeMarkers();
  acc.setAttribute('r', inView ? Math.max(accuracy / M_PER_DEG * SCALE, 0) : 0);

  const changed = current !== hit;
  current = hit;
  // Beim ersten Fix automatisch in den Bezirk zoomen
  if (firstFix && hit) { firstFix = false; zoomed = true; setTimeout(applyZoom, 500); }
  else if (changed) applyZoom();
  else placeLabels();

  const t = new Date(pos.timestamp || Date.now());
  if (!$('accNum')) $('meta').innerHTML = `Genauigkeit ± <span id="accNum">0</span> m<br><span id="ts"></span>`;
  countAcc(Math.round(accuracy));
  $('ts').textContent = `Stand ${t.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
}

function fail(err) {
  $('refresh').classList.remove('busy');
  // Kurzer Aussetzer bei bestehendem Standort: Anzeige behalten
  if (hasFix && err && err.code !== 1) { $('ts') && ($('ts').textContent = 'Signal kurz weg – zeige letzten Stand'); return; }
  const msg = {
    1: ['Kein Zugriff', 'Erlaube den Standort: Einstellungen › Datenschutz › Ortungsdienste › Safari-Websites › „Beim Verwenden“.'],
    2: ['Kein Signal', 'Standort gerade nicht verfügbar. Versuch es draußen oder gleich nochmal.'],
    3: ['Zeitüberschreitung', 'Das hat zu lange gedauert. Tipp auf „Aktualisieren“.'],
  }[err && err.code] || ['Fehler', 'Standort konnte nicht ermittelt werden.'];
  $('lbl').textContent = 'Standort';
  setName(msg[0]);
  swapText('bezirk', '');
  swapText('hint', msg[1]);
  $('meta').textContent = 'Kein Standort';
}

let watchId = null;
function start() {
  if (!('geolocation' in navigator)) { fail(); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  $('refresh').classList.add('busy');
  watchId = navigator.geolocation.watchPosition(render, fail, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
function stop() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

$('refresh').addEventListener('click', start);
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
start();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
